services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: markaz
      POSTGRES_PASSWORD: markaz
      POSTGRES_DB: markaz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markaz -d markaz"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Not a secret: this compose file is for local use. Override it for anything
      # that other people can reach.
      SECRET_KEY: local-dev-key-not-for-production-please-change
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://markaz:markaz@db:5432/markaz
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
